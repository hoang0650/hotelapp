<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHHotel · Google Sign-In</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div>
    <p><strong>PHHotel</strong></p>
    <p>Đang hoàn tất đăng nhập Google… Bạn có thể đóng trang này.</p>
  </div>
  <script>
    // Deep-link fallback nếu in-app browser không tự đóng (một số thiết bị).
    (function () {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      if (!hash && !search) return;
      var target = 'rork-app://oauthredirect' + search + hash;
      try {
        window.location.replace(target);
      } catch (e) {}
    })();
  </script>
</body>
</html>
