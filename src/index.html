  <script>
    // Ép HTTPS ngay từ HTML (trước khi Angular load) — tránh badge "Không bảo mật" do HTTP
    (function () {
      try {
        var h = location.hostname || '';
        if (
          location.protocol === 'http:' &&
          (h === 'admin.phhotel.vn' || h === 'phhotel.vn' || h === 'www.phhotel.vn')
        ) {
          location.replace('https://' + h + location.pathname + location.search + location.hash);
        }
      } catch (e) {}
    })();
  </script>

  <script>
    (function () {
      try {
        var theme = null;
        var match = document.cookie.match(/(?:^|;\s*)phhotel_theme=([^;]*)/);
        if (match) theme = decodeURIComponent(match[1]);
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
