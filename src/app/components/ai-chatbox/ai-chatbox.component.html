<div class="ai-chatbox-container" [class.minimized]="minimized" *ngIf="canUseAiChatbox">
  <button nz-button nzType="primary" nzShape="circle" class="chatbox-toggle" (click)="toggleMinimize()"
    [title]="(minimized ? ('AI_CHATBOX.OPEN_CHAT' | translate) : ('AI_CHATBOX.CLOSE_CHAT' | translate))"
    [attr.aria-label]="(minimized ? ('AI_CHATBOX.OPEN_CHAT' | translate) : ('AI_CHATBOX.CLOSE_CHAT' | translate))">
    <i nz-icon [nzType]="minimized ? 'message' : 'close'" nzTheme="outline"></i>
  </button>

  <nz-card *ngIf="!minimized" [nzBodyStyle]="{padding: '8px 0 0 0'}" class="ai-chatbox-card">
    
    <!-- HEADER -->
    <div class="ai-chatbox-header">
      <div class="ai-chatbox-header-left">
        <div style="display:flex; flex-direction:column; gap:2px;">
          <span class="ai-chatbox-title">{{ chatboxModeTitle }}</span>
          <span style="font-size:12px; color:#6b7280;">{{ chatboxModeDescription }}</span>
        </div>
        <nz-select *ngIf="hotels.length > 0" [(ngModel)]="selectedHotelId" (ngModelChange)="onSelectHotel($event)"
          [nzDisabled]="isHotelSelectionDisabled" nzSize="small" nzShowSearch [nzAllowClear]="false"
          class="hotel-select">
          <nz-option *ngFor="let hotel of hotels" [nzValue]="hotel._id" [nzLabel]="hotel.name"></nz-option>
        </nz-select>
      </div>

      <!-- HEADER ACTIONS -->
      <div class="ai-chatbox-header-actions">
        <!-- Nút Mở OpenClaw (Tự động kích hoạt triggerAutoApproveDevicePairing) -->
        <button nz-button nzType="default" nzSize="small" 
          [nzLoading]="openingOpenClaw || isApprovingDevice" 
          [disabled]="!canOpenOpenClaw"
          (click)="openOpenClawGateway()" 
          class="btn-openclaw"
          [title]="isApprovingDevice ? 'Đang tự động duyệt kết nối...' : 'Mở giao diện điều khiển OpenClaw'">
          <i nz-icon [nzType]="isApprovingDevice ? 'sync' : 'dashboard'" [nzSpin]="isApprovingDevice" nzTheme="outline"></i>
          <span>{{ isApprovingDevice ? 'Đang Approve...' : 'Mở OpenClaw' }}</span>
        </button>

        <!-- Nút Duyệt ghép đôi thủ công (Dự phòng) -->
        <button *ngIf="!isApprovingDevice" nz-button nzType="text" nzSize="small" 
          (click)="manualApprovePairing()" 
          title="Thử duyệt lại kết nối thiết bị" class="approve-retry-btn">
          <i nz-icon nzType="check-circle" nzTheme="outline"></i>
        </button>

        <!-- Nút Xóa lịch sử -->
        <button nz-button nzType="text" nzSize="small" (click)="clearChatHistory()" [disabled]="messages.length === 0"
          [title]="'AI_CHATBOX.CLEAR_HISTORY_TITLE' | translate" class="clear-history-btn">
          <i nz-icon nzType="delete" nzTheme="outline"></i>
          <span class="clear-history-text">{{ 'AI_CHATBOX.CLEAR_HISTORY' | translate }}</span>
        </button>
      </div>
    </div>

    <!-- KHUNG CHAT MESSAGES -->
    <div class="ai-chatbox-messages" #messagesEnd>
      <div *ngFor="let msg of messages" class="chat-message-row" [ngClass]="msg.role">
        <div class="chat-message-bubble-group" [ngClass]="msg.role">
          <nz-avatar *ngIf="msg.role === 'assistant'" nzIcon="robot" nzShape="circle" nzSize="small"
            class="avatar"></nz-avatar>
          <div class="bubble" [ngClass]="msg.role">
            <div class="msg-content markdown-content" [innerHTML]="msg.content | markdown"></div>
            <ng-container *ngIf="msg.fileUrl">
              <img *ngIf="msg.fileType?.startsWith('image')" [src]="msg.fileUrl" class="chat-img-in-bubble"
                [alt]="'AI_CHATBOX.ATTACHED_IMAGE' | translate" />
              <a *ngIf="!msg.fileType?.startsWith('image')" [href]="msg.fileUrl" target="_blank" class="file-card-link">
                <div class="file-card">
                  <div class="file-card-header">
                    <i nz-icon [nzType]="getFileIconType(msg)" nzTheme="outline"></i>
                    <span class="file-card-title">File AI tạo</span>
                  </div>
                  <div class="file-card-name">{{ getFileDisplayName(msg) }}</div>
                  <div class="file-card-action">Mở file</div>
                </div>
              </a>
            </ng-container>
            <div class="msg-time">{{msg.timestamp | date:'shortTime'}}</div>
          </div>
          <nz-avatar *ngIf="msg.role === 'user'" nzIcon="user" nzShape="circle" nzSize="small"
            class="avatar"></nz-avatar>
        </div>
      </div>
      <div *ngIf="isTyping" class="ai-chatbox-typing">
        <nz-spin nzSimple></nz-spin>
        <span class="ai-typing-text">{{ 'AI_CHATBOX.AI_TYPING' | translate }}<span class="dot">.</span><span
            class="dot">.</span><span class="dot">.</span></span>
      </div>
    </div>

    <!-- PREVIEW FILE DỰ ĐỊNH GỬI -->
    <div *ngIf="selectedFile" class="selected-file-preview">
      <div class="file-preview-content">
        <img *ngIf="selectedFileType?.startsWith('image')" [src]="selectedFilePreview" class="chat-img-thumb"
          [alt]="'AI_CHATBOX.PREVIEW_IMAGE' | translate" />
        <ng-container *ngIf="!selectedFileType?.startsWith('image')">
          <i nz-icon nzType="file" nzTheme="outline" class="file-icon"></i>
          <span class="file-name">{{selectedFileName}}</span>
        </ng-container>
        <button nz-button nzType="link" (click)="removeSelectedFile()" [title]="'AI_CHATBOX.REMOVE_FILE' | translate"
          class="remove-file-btn">
          <i nz-icon nzType="close"></i>
        </button>
      </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="ai-chatbox-quick-actions" *ngIf="canAskRevenue">
      <button nz-button nzSize="small" nzType="default" class="quick-action-btn"
        *ngFor="let action of revenueQuickActions" (click)="sendQuickMessage(action.query)" [disabled]="isTyping">
        {{ action.label }}
      </button>
    </div>
    <div class="ai-chatbox-quick-actions ai-chatbox-export-actions" *ngIf="canAskRevenue">
      <button nz-button nzSize="small" nzType="default" class="quick-action-btn export-action-btn"
        *ngFor="let action of exportQuickActions" (click)="sendQuickMessage(action.query)" [disabled]="isTyping">
        <i nz-icon nzType="download" nzTheme="outline"></i>
        <span>{{ action.label }}</span>
      </button>
    </div>
    <div class="ai-chatbox-quick-actions ai-chatbox-export-actions">
      <button nz-button nzSize="small" nzType="default" class="quick-action-btn export-action-btn"
        *ngFor="let action of webQuickActions" (click)="sendQuickMessage(action.query)" [disabled]="isTyping">
        <i nz-icon nzType="global" nzTheme="outline"></i>
        <span>{{ action.label }}</span>
      </button>
    </div>

    <!-- INPUT CHAT -->
    <div class="ai-chatbox-input">
      <nz-upload [nzShowUploadList]="false" [nzBeforeUpload]="beforeUpload" nzAccept="image/*,.pdf,.doc,.docx,.txt">
        <button nz-button nzShape="circle" nzType="default" [title]="'AI_CHATBOX.UPLOAD_FILE_IMAGE' | translate"
          class="upload-btn" [attr.aria-label]="'AI_CHATBOX.UPLOAD_FILE_IMAGE' | translate">
          <i nz-icon nzType="paper-clip"></i>
        </button>
      </nz-upload>
      <input nz-input [(ngModel)]="inputValue" (keydown.enter)="sendMessage()" [disabled]="isTyping"
        [placeholder]="'AI_CHATBOX.MESSAGE_PLACEHOLDER' | translate" />
      <button nz-button nzType="primary" (click)="sendMessage()" [disabled]="!inputValue && !selectedFile || isTyping"
        [title]="'AI_CHATBOX.SEND' | translate">
        <i nz-icon nzType="send" nzTheme="outline"></i>
      </button>
    </div>
  </nz-card>
</div>
