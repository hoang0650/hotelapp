<div class="ai-chatbox-container" [class.minimized]="minimized" *ngIf="canUseAiChatbox">
  <button nz-button nzType="primary" nzShape="circle" class="chatbox-toggle" (click)="toggleMinimize()" [title]="(minimized ? ('AI_CHATBOX.OPEN_CHAT' | translate) : ('AI_CHATBOX.CLOSE_CHAT' | translate))" [attr.aria-label]="(minimized ? ('AI_CHATBOX.OPEN_CHAT' | translate) : ('AI_CHATBOX.CLOSE_CHAT' | translate))">
    <i nz-icon [nzType]="minimized ? 'message' : 'close'" nzTheme="outline"></i>
  </button>
  <nz-card *ngIf="!minimized" [nzBodyStyle]="{padding: '8px 0 0 0'}" class="ai-chatbox-card">
    <div class="ai-chatbox-header">
      <span class="ai-chatbox-title">{{ 'AI_CHATBOX.TITLE' | translate }}</span>
      <button 
        nz-button 
        nzType="default" 
        nzSize="small" 
        (click)="openFanpageMessages()">
        <i nz-icon nzType="message" nzTheme="outline"></i>
        <span>Xem lịch sử Fanpage</span>
      </button>
      <button 
        nz-button 
        nzType="default" 
        nzSize="small" 
        (click)="connectFanpage()" 
        [title]="'Kết nối Fanpage'">
        <i nz-icon nzType="link" nzTheme="outline"></i>
        <span>Kết nối Fanpage</span>
      </button>
      <button 
        nz-button 
        nzType="text" 
        nzSize="small" 
        (click)="clearChatHistory()" 
        [disabled]="messages.length === 0"
        [title]="'AI_CHATBOX.CLEAR_HISTORY_TITLE' | translate"
        class="clear-history-btn">
        <i nz-icon nzType="delete" nzTheme="outline"></i>
        <span class="clear-history-text">{{ 'AI_CHATBOX.CLEAR_HISTORY' | translate }}</span>
      </button>
    </div>
    <div class="ai-chatbox-messages" #messagesEnd>
      <div *ngFor="let msg of messages" class="chat-message-row" [ngClass]="msg.role">
        <div class="chat-message-bubble-group" [ngClass]="msg.role">
          <nz-avatar *ngIf="msg.role === 'assistant'" nzIcon="robot" nzShape="circle" nzSize="small" class="avatar"></nz-avatar>
          <div class="bubble" [ngClass]="msg.role">
            <div class="msg-content markdown-content" [innerHTML]="msg.content | markdown"></div>
            <ng-container *ngIf="msg.fileUrl">
              <img *ngIf="msg.fileType?.startsWith('image')" [src]="msg.fileUrl" class="chat-img-in-bubble" [alt]="'AI_CHATBOX.ATTACHED_IMAGE' | translate" />
              <a *ngIf="!msg.fileType?.startsWith('image')" [href]="msg.fileUrl" target="_blank" class="file-link"><i nz-icon nzType="file" nzTheme="outline"></i> {{msg.fileUrl.split('/').pop()}}</a>
            </ng-container>
            <div class="msg-time">{{msg.timestamp | date:'shortTime'}}</div>
          </div>
          <nz-avatar *ngIf="msg.role === 'user'" nzIcon="user" nzShape="circle" nzSize="small" class="avatar"></nz-avatar>
        </div>
      </div>
      <div *ngIf="isTyping" class="ai-chatbox-typing">
        <nz-spin nzSimple></nz-spin>
        <span class="ai-typing-text">{{ 'AI_CHATBOX.AI_TYPING' | translate }}<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
      </div>
    </div>
    <div *ngIf="selectedFile" class="selected-file-preview">
      <div class="file-preview-content">
        <img *ngIf="selectedFileType?.startsWith('image')" [src]="selectedFilePreview" class="chat-img-thumb" [alt]="'AI_CHATBOX.PREVIEW_IMAGE' | translate" />
        <ng-container *ngIf="!selectedFileType?.startsWith('image')">
          <i nz-icon nzType="file" nzTheme="outline" class="file-icon"></i>
          <span class="file-name">{{selectedFileName}}</span>
        </ng-container>
        <button nz-button nzType="link" (click)="removeSelectedFile()" [title]="'AI_CHATBOX.REMOVE_FILE' | translate" class="remove-file-btn">
          <i nz-icon nzType="close"></i>
        </button>
      </div>
    </div>
    <div class="ai-chatbox-quick-actions" *ngIf="canAskRevenue">
      <button
        nz-button
        nzSize="small"
        nzType="default"
        class="quick-action-btn"
        *ngFor="let action of revenueQuickActions"
        (click)="sendQuickMessage(action.query)"
        [disabled]="isTyping"
      >
        {{ action.label }}
      </button>
    </div>
    <div class="ai-chatbox-input">
      <nz-upload
        [nzShowUploadList]="false"
        [nzBeforeUpload]="beforeUpload"
        nzAccept="image/*,.pdf,.doc,.docx,.txt"
      >
        <button nz-button nzShape="circle" nzType="default" [title]="'AI_CHATBOX.UPLOAD_FILE_IMAGE' | translate" class="upload-btn" [attr.aria-label]="'AI_CHATBOX.UPLOAD_FILE_IMAGE' | translate">
          <i nz-icon nzType="paper-clip"></i>
        </button>
      </nz-upload>
      <input nz-input [(ngModel)]="inputValue" (keydown.enter)="sendMessage()" [disabled]="isTyping" [placeholder]="'AI_CHATBOX.MESSAGE_PLACEHOLDER' | translate" />
      <button nz-button nzType="primary" (click)="sendMessage()" [disabled]="!inputValue && !selectedFile || isTyping" [title]="'AI_CHATBOX.SEND' | translate">
        <i nz-icon nzType="send" nzTheme="outline"></i>
      </button>
    </div>
  </nz-card>
</div>
