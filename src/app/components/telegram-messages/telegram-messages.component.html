<div class="container-wrapper">
  <h2 style="margin-bottom: 15px;">Telegram Messages</h2>

  <div *ngIf="loading" class="loading-state">
    <nz-spin nzSimple nzTip="Đang tải dữ liệu..."></nz-spin>
  </div>

  <div *ngIf="!loading" class="main-content">

    <div class="toolbar">
      <div class="toolbar-left">
        <label class="mr-2">Bot:</label>
        <nz-select
          [ngModel]="selectedBotId"
          (ngModelChange)="changeBot($event)"
          nzShowSearch
          nzPlaceHolder="Chọn bot"
          style="min-width: 250px">
          <nz-option *ngFor="let b of bots" [nzValue]="b.id" [nzLabel]="b.first_name || b.username || b.id"></nz-option>
        </nz-select>
      </div>

      <div class="toolbar-right">
        <div class="d-flex align-items-center mr-3" *ngIf="selectedBotId">
          <span class="mr-2" style="font-weight: 500;">AI Bot:</span>
          <nz-switch
            [ngModel]="isBotActive"
            (ngModelChange)="toggleBot($event)"
            nzCheckedChildren="Bật"
            nzUnCheckedChildren="Tắt">
          </nz-switch>
        </div>

        <button nz-button nzType="default" (click)="refreshData()" title="Làm mới dữ liệu" class="mr-2">
          <i nz-icon nzType="reload" nzTheme="outline"></i>
        </button>

        <button nz-button nzType="primary" nzGhost (click)="openConnectModal()" title="Kết nối Telegram Bot" class="mr-2">
          <i nz-icon nzType="robot" nzTheme="outline"></i>
          <span>Kết nối Bot</span>
        </button>

        <button nz-button nzType="default" class="sidebar-toggle d-md-none" (click)="toggleSidebar()">
          <i nz-icon nzType="menu-fold" nzTheme="outline" *ngIf="showSidebar"></i>
          <i nz-icon nzType="menu-unfold" nzTheme="outline" *ngIf="!showSidebar"></i>
        </button>
      </div>
    </div>

    <div class="layout-chat">

      <div class="sidebar" [class.hidden]="!showSidebar && isMobile">
        <div class="empty-state" *ngIf="conversations.length === 0">
          <nz-empty nzNotFoundImage="simple" nzNotFoundContent="Chưa có hội thoại nào"></nz-empty>
        </div>

        <div *ngFor="let c of conversations"
             class="conv-item"
             [class.active]="c.sender_id === selectedSenderId"
             (click)="selectConversation(c.sender_id)">
          <div class="conv-avatar">
            <i nz-icon nzType="user" nzTheme="outline"></i>
          </div>
          <div class="conv-info">
            <div class="conv-top">
              <span class="conv-title">{{ c.sender_name }}</span>
              <span class="conv-time">{{ c.lastTime | date:'HH:mm dd/MM' }}</span>
            </div>
            <div class="conv-last text-truncate">{{ c.lastText }}</div>
          </div>
        </div>
      </div>

      <div class="thread" [class.hidden]="showSidebar && isMobile">

        <div class="empty-state-thread" *ngIf="!selectedSenderId">
          <nz-empty nzNotFoundImage="simple" nzNotFoundContent="Chọn một hội thoại để bắt đầu chat"></nz-empty>
        </div>

        <div class="message-list" #threadList *ngIf="selectedSenderId">
          <div *ngFor="let m of displayed" class="bubble-row" [class.out]="m.direction === 'out'">
            <div class="bubble">
              <div class="text markdown-content" *ngIf="m.text" [innerHTML]="m.text | markdown"></div>
              <div class="meta">
                <span class="time">{{ m.timestamp | date:'HH:mm dd/MM/yyyy' }}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="reply-box" *ngIf="selectedSenderId">
          <div class="input-wrapper">
            <input nz-input
                   type="text"
                   [(ngModel)]="replyText"
                   placeholder="Nhập tin nhắn..."
                   (keyup.enter)="onEnterSend($event)"
                   [disabled]="sending" />
            <button nz-button nzType="primary" [nzLoading]="sending" [disabled]="!replyText.trim()" (click)="sendReply()">
              <i nz-icon nzType="send" nzTheme="outline"></i> Gửi
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Connect Bot Modal -->
<nz-modal
  [(nzVisible)]="showConnectModal"
  nzTitle="Kết nối Telegram Bot"
  (nzOnCancel)="showConnectModal = false"
  (nzOnOk)="connectBot()"
  [nzOkLoading]="connecting"
  nzOkText="Kết nối"
  nzCancelText="Hủy">
  <ng-container *nzModalContent>
    <p>Nhập Bot Token từ <strong>&#64;BotFather</strong> trên Telegram:</p>
    <input nz-input
           [(ngModel)]="botTokenInput"
           placeholder="Ví dụ: 123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"
           (keyup.enter)="connectBot()" />
  </ng-container>
</nz-modal>
