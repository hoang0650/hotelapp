<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-sm-6 col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Đặt lại mật khẩu</h5>
          <p class="text-center text-muted mb-4">Nhập mật khẩu mới của bạn</p>
          <form nz-form [formGroup]="resetPasswordForm" class="login-form" (ngSubmit)="submitForm()">
            <nz-form-item>
              <nz-form-control 
                nzErrorTip="Vui lòng nhập mật khẩu mới!"
                [nzErrorTip]="resetPasswordForm.get('password')?.hasError('minlength') ? 'Mật khẩu phải có ít nhất 6 ký tự' : 'Vui lòng nhập mật khẩu mới!'">
                <nz-input-group nzPrefixIcon="lock">
                  <input 
                    [type]="passwordVisible ? 'text' : 'password'" 
                    nz-input 
                    formControlName="password" 
                    placeholder="Mật khẩu mới" />
                  <span 
                    nz-icon 
                    [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                    (click)="passwordVisible = !passwordVisible"
                    style="cursor: pointer;">
                  </span>
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <nz-form-item>
              <nz-form-control 
                nzErrorTip="Vui lòng xác nhận mật khẩu!"
                [nzErrorTip]="resetPasswordForm.get('confirmPassword')?.hasError('passwordMismatch') ? 'Mật khẩu không khớp' : 'Vui lòng xác nhận mật khẩu!'">
                <nz-input-group nzPrefixIcon="lock">
                  <input 
                    [type]="confirmPasswordVisible ? 'text' : 'password'" 
                    nz-input 
                    formControlName="confirmPassword" 
                    placeholder="Xác nhận mật khẩu mới" />
                  <span 
                    nz-icon 
                    [nzType]="confirmPasswordVisible ? 'eye-invisible' : 'eye'"
                    (click)="confirmPasswordVisible = !confirmPasswordVisible"
                    style="cursor: pointer;">
                  </span>
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <button nz-button 
                    [nzType]="'primary'" 
                    [nzLoading]="isLoading"
                    [nzBlock]="true"
                    class="login-form-button login-form-margin">
              Đặt lại mật khẩu
            </button>
            
            <div nz-row class="login-form-margin text-center">
              <a (click)="goToLogin()" style="cursor: pointer;">Quay lại đăng nhập</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
