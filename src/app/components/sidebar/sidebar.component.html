<button nz-button nzType="primary" (click)="toggleCollapsed()" [nzTooltipTitle]="'SIDEBAR.TOGGLE_COLLAPSE' | translate" nz-tooltip>
  <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
</button>
<ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed">
  <ng-container *ngFor="let item of menuItems">
    <!-- Menu item có children (submenu) -->
    <li *ngIf="item.children && item.children.length > 0" nz-submenu [nzTitle]="item.title" [nzIcon]="item.icon || 'setting'">
      <ul>
        <li 
          *ngFor="let child of item.children" 
          nz-menu-item 
          [routerLink]="child.route"
          [nzTooltipTitle]="isCollapsed ? child.title : ''"
          nz-tooltip
          nzTooltipPlacement="right">
          <span>{{ child.title }}</span>
        </li>
      </ul>
    </li>
    
    <!-- Menu item đơn giản (không có children) -->
    <li 
      *ngIf="!item.children && item.route"
      nz-menu-item
      nz-tooltip
      nzTooltipPlacement="right"
      [nzTooltipTitle]="isCollapsed ? item.title : ''"
      [routerLink]="item.route"
      routerLinkActive="ant-menu-item-selected">
      <span *ngIf="item.icon" nz-icon [nzType]="item.icon"></span>
      <span>{{ item.title }}</span>
    </li>
  </ng-container>
</ul>
