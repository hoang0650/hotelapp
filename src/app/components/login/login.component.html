<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-sm-6 col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Đăng nhập tài khoản</h5>
          <form nz-form [formGroup]="loginForm" class="login-form" (ngSubmit)="submitForm()">
            <nz-form-item>
              <nz-form-control nzErrorTip="Vui lòng nhập tên đăng nhập hoặc email!">
                <nz-input-group nzPrefixIcon="user">
                  <input type="text" nz-input formControlName="emailOrUsername" placeholder="Tên đăng nhập hoặc Email" />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>
            
            <nz-form-item>
              <nz-form-control nzErrorTip="Vui lòng nhập mật khẩu!">
                <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixTemplate">
                  <input [type]="passwordVisible ? 'text' : 'password'" 
                         nz-input 
                         formControlName="password" 
                         placeholder="Mật khẩu" />
                  <span nz-icon 
                        [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                        (click)="passwordVisible = !passwordVisible">
                  </span>
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <ng-container *ngIf="loginForm.get('twoFactorCode')?.hasValidator(Validators.required)">
              <nz-form-item>
                <nz-form-control nzErrorTip="Vui lòng nhập mã xác thực!">
                  <nz-input-group nzPrefixIcon="safety-certificate">
                    <input type="text" 
                           nz-input 
                           formControlName="twoFactorCode" 
                           placeholder="Mã xác thực hai yếu tố" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </ng-container>

            <div nz-row class="login-form-margin">
              <div nz-col [nzSpan]="12">
                <label nz-checkbox formControlName="remember">
                  <span>Ghi nhớ đăng nhập</span>
                </label>
              </div>
              <div nz-col [nzSpan]="12">
                <a class="login-form-forgot" routerLink="/forgot-password">Quên mật khẩu?</a>
              </div>
            </div>

            <button nz-button 
                    [nzType]="'primary'" 
                    [nzLoading]="isLoading"
                    class="login-form-button login-form-margin">
              Đăng nhập
            </button>
            
            <div nz-row class="login-form-margin">
              <span>Chưa có tài khoản? </span>
              <a routerLink="/signup">Đăng ký ngay!</a>
            </div>
          </form>
          <div class=" social-login">
            <p>Or login with:</p>
            <button class="btn btn-light social-btn" title="Đăng nhập với Google">
              <i class="fab fa-google"></i>
            </button>
            <button class="btn btn-light social-btn" title="Đăng nhập với Twitter">
              <i class="fab fa-twitter"></i>
            </button>
          </div>
          <hr>
          <p class="text-center">Bạn là doanh nghiệp? <a [routerLink]="['signup']">Đăng ký tài khoản doanh nghiệp</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
