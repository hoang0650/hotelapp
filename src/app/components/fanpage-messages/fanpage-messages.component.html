<div class="container-wrapper">
  <h2 style="margin-bottom: 15px;">Fanpage Messages</h2>

  <div *ngIf="loading" class="loading-state">
    <nz-spin nzSimple nzTip="Đang tải dữ liệu..."></nz-spin>
  </div>

  <div *ngIf="!loading" class="main-content">
    
    <div class="toolbar">
      <div class="toolbar-left">
        <label class="mr-2">Fanpage:</label>
        <nz-select
          [ngModel]="selectedPageId"
          (ngModelChange)="changePage($event)"
          nzShowSearch
          nzPlaceHolder="Chọn fanpage"
          style="min-width: 250px">
          <nz-option *ngFor="let p of pages" [nzValue]="p.id" [nzLabel]="p.name"></nz-option>
        </nz-select>
      </div>

      <div class="toolbar-right">
        <div class="d-flex align-items-center mr-3" *ngIf="selectedPageId">
          <span class="mr-2" style="font-weight: 500;">AI Bot:</span>
          <nz-switch 
            [ngModel]="isBotActive" 
            (ngModelChange)="toggleBot($event)"
            nzCheckedChildren="Bật" 
            nzUnCheckedChildren="Tắt">
          </nz-switch>
        </div>
        <span *ngIf="selectedPageId" style="font-size: 12px; color: #6b7280;" class="mr-3">
          {{ botModeText }}
        </span>

        <button nz-button nzType="default" (click)="refreshData()" title="Làm mới dữ liệu" class="mr-2">
          <i nz-icon nzType="reload" nzTheme="outline"></i>
        </button>

        <button nz-button nzType="primary" nzGhost (click)="connectFanpage()" title="Kết nối Fanpage Mới" class="mr-2">
          <i nz-icon nzType="facebook" nzTheme="outline"></i>
          <span>Kết nối</span>
        </button>

        <button nz-button nzType="default" (click)="openManualConnect()" title="Kết nối bằng Access Token (khi login Facebook bị chặn)" class="mr-2">
          <i nz-icon nzType="key" nzTheme="outline"></i>
          <span>Nhập token</span>
        </button>
        
        <button nz-button nzType="default" class="sidebar-toggle d-md-none" (click)="toggleSidebar()">
          <i nz-icon nzType="menu-fold" nzTheme="outline" *ngIf="showSidebar"></i>
          <i nz-icon nzType="menu-unfold" nzTheme="outline" *ngIf="!showSidebar"></i>
        </button>
      </div>
    </div>

    <div class="layout-chat">
      
      <div class="sidebar" [class.hidden]="!showSidebar && isMobile">
        <div class="empty-state" *ngIf="conversations.length === 0">
          <nz-empty nzNotFoundImage="simple" nzNotFoundContent="Chưa có hội thoại nào"></nz-empty>
        </div>

        <div *ngFor="let c of conversations" 
             class="conv-item" 
             [class.active]="c.sender_id === selectedSenderId" 
             (click)="selectConversation(c.sender_id)">
          <div class="conv-avatar">
            <img *ngIf="c.sender_avatar" [src]="c.sender_avatar" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
            <i *ngIf="!c.sender_avatar" nz-icon nzType="user" nzTheme="outline"></i>
          </div>
          <div class="conv-info">
            <div class="conv-top">
              <span class="conv-title">{{ c.sender_name }}</span>
              <span class="conv-time">{{ c.lastTime | date:'HH:mm dd/MM' }}</span>
            </div>
            <div class="conv-last text-truncate">{{ c.lastText }}</div>
          </div>
        </div>
      </div>

      <div class="thread" [class.hidden]="showSidebar && isMobile">
        
        <div class="empty-state-thread" *ngIf="!selectedSenderId">
          <nz-empty nzNotFoundImage="simple" nzNotFoundContent="Chọn một hội thoại để bắt đầu chat"></nz-empty>
        </div>

        <div class="message-list" #threadList *ngIf="selectedSenderId">
          <div *ngFor="let m of displayed" class="bubble-row" [class.out]="m.direction === 'out'" [class.bot-reply]="m.is_bot">
            <div class="bubble">
              <div class="bot-tag" *ngIf="m.is_bot">
                <i nz-icon nzType="robot" nzTheme="outline"></i> Bot
              </div>
              <div class="text markdown-content" *ngIf="m.text" [innerHTML]="m.text | markdown"></div>
              
              <div class="attachments" *ngIf="m.attachments && m.attachments.length > 0">
                <div *ngFor="let att of m.attachments" class="attachment-item">
                  <ng-container [ngSwitch]="att.type">
                    <img *ngSwitchCase="'image'" [src]="att.payload.url" class="att-img" (click)="previewImage(att.payload.url)">
                    <video *ngSwitchCase="'video'" [src]="att.payload.url" controls class="att-video"></video>
                    <audio *ngSwitchCase="'audio'" [src]="att.payload.url" controls class="att-audio"></audio>
                    <a *ngSwitchDefault [href]="att.payload.url" target="_blank" class="att-link">
                      <i nz-icon nzType="file" nzTheme="outline"></i> File
                    </a>
                  </ng-container>
                </div>
              </div>

              <div class="meta">
                <span class="time">{{ m.timestamp | date:'HH:mm dd/MM/yyyy' }}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="reply-box" *ngIf="selectedSenderId">
          <div class="input-wrapper">
            <input nz-input 
                   type="text" 
                   [(ngModel)]="replyText" 
                   placeholder="Nhập tin nhắn..." 
                   (keyup.enter)="onEnterSend($event)"
                   [disabled]="sending" />
            <button nz-button nzType="primary" [nzLoading]="sending" [disabled]="!replyText.trim()" (click)="sendReply()">
              <i nz-icon nzType="send" nzTheme="outline"></i> Gửi
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <nz-modal
    [(nzVisible)]="showManualConnect"
    nzTitle="Kết nối Fanpage bằng Access Token"
    [nzOkLoading]="connectingManual"
    [nzOkDisabled]="!manualToken.trim()"
    nzOkText="Kết nối"
    nzCancelText="Đóng"
    (nzOnOk)="connectManualToken()"
    (nzOnCancel)="showManualConnect = false">
    <ng-container *nzModalContent>
      <nz-alert
        nzType="info"
        nzShowIcon
        nzMessage="Dùng khi popup đăng nhập Facebook báo 'Hiện không dùng được tính năng này'"
        nzDescription="Nguyên nhân: App Facebook đang ở chế độ Development nên chỉ tài khoản có vai trò trong App (Admin/Developer/Tester) mới đăng nhập được. Cách lấy token: (1) Thêm tài khoản khách làm Tester của App tại developers.facebook.com → App roles, hoặc (2) Admin dùng Graph API Explorer (developers.facebook.com/tools/explorer) chọn App PHHotel, cấp quyền pages_show_list, pages_messaging, pages_manage_metadata, pages_read_engagement rồi copy User Access Token dán vào đây — hệ thống sẽ tự lấy toàn bộ Fanpage. Cũng có thể dán trực tiếp Page Access Token của 1 Fanpage."
        style="margin-bottom: 16px;">
      </nz-alert>
      <textarea
        nz-input
        [(ngModel)]="manualToken"
        placeholder="Dán User Access Token hoặc Page Access Token vào đây (EAAxxxx...)"
        [nzAutosize]="{ minRows: 3, maxRows: 6 }"
        [disabled]="connectingManual">
      </textarea>
    </ng-container>
  </nz-modal>
</div>
