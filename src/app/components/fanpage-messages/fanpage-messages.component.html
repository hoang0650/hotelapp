<div class="container-wrapper">
  <h2 style="margin-bottom: 15px;">Fanpage Messages</h2>

  <div *ngIf="loading" class="loading-state">
    <nz-spin nzSimple nzTip="Đang tải dữ liệu..."></nz-spin>
  </div>

  <div *ngIf="!loading" class="main-content">
    
    <div class="toolbar">
      <div class="toolbar-left">
        <label class="mr-2">Fanpage:</label>
        <nz-select
          [ngModel]="selectedPageId"
          (ngModelChange)="changePage($event)"
          nzShowSearch
          nzPlaceHolder="Chọn fanpage"
          style="min-width: 250px">
          <nz-option *ngFor="let p of pages" [nzValue]="p.id" [nzLabel]="p.name"></nz-option>
        </nz-select>
      </div>

      <div class="toolbar-right">
        <button nz-button nzType="primary" nzGhost (click)="connectFanpage()" title="Kết nối Fanpage Mới" class="mr-2">
          <i nz-icon nzType="facebook" nzTheme="outline"></i>
          <span>Kết nối</span>
        </button>
        
        <button nz-button nzType="default" class="sidebar-toggle d-md-none" (click)="toggleSidebar()">
          <i nz-icon nzType="menu-fold" nzTheme="outline" *ngIf="showSidebar"></i>
          <i nz-icon nzType="menu-unfold" nzTheme="outline" *ngIf="!showSidebar"></i>
        </button>
      </div>
    </div>

    <div class="layout-chat">
      
      <div class="sidebar" [class.hidden]="!showSidebar && isMobile">
        <div class="empty-state" *ngIf="conversations.length === 0">
          <nz-empty nzNotFoundImage="simple" nzNotFoundContent="Chưa có hội thoại nào"></nz-empty>
        </div>

        <div *ngFor="let c of conversations" 
             class="conv-item" 
             [class.active]="c.sender_id === selectedSenderId" 
             (click)="selectConversation(c.sender_id)">
          <div class="conv-avatar">
            <img *ngIf="c.sender_avatar" [src]="c.sender_avatar" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
            <i *ngIf="!c.sender_avatar" nz-icon nzType="user" nzTheme="outline"></i>
          </div>
          <div class="conv-info">
            <div class="conv-top">
              <span class="conv-title">{{ c.sender_name }}</span>
              <span class="conv-time">{{ c.lastTime | date:'HH:mm dd/MM' }}</span>
            </div>
            <div class="conv-last text-truncate">{{ c.lastText }}</div>
          </div>
        </div>
      </div>

      <div class="thread" [class.hidden]="showSidebar && isMobile">
        
        <div class="empty-state-thread" *ngIf="!selectedSenderId">
          <nz-empty nzNotFoundImage="simple" nzNotFoundContent="Chọn một hội thoại để bắt đầu chat"></nz-empty>
        </div>

        <div class="message-list" #threadList *ngIf="selectedSenderId">
          <div *ngFor="let m of displayed" class="bubble-row" [class.out]="m.direction === 'out'">
            <div class="bubble">
              <div class="text">{{ m.text }}</div>
              <div class="meta">
                <span class="time">{{ m.timestamp | date:'HH:mm dd/MM/yyyy' }}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="reply-box" *ngIf="selectedSenderId">
          <div class="input-wrapper">
            <input nz-input 
                   type="text" 
                   [(ngModel)]="replyText" 
                   placeholder="Nhập tin nhắn..." 
                   (keyup.enter)="onEnterSend($event)"
                   [disabled]="sending" />
            <button nz-button nzType="primary" [nzLoading]="sending" [disabled]="!replyText.trim()" (click)="sendReply()">
              <i nz-icon nzType="send" nzTheme="outline"></i> Gửi
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
