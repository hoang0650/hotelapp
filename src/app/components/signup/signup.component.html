<div class="signup-container">
  <nz-card class="signup-card">
    <h2 class="text-center">Đăng ký tài khoản</h2>
    
    <nz-tabset (nzSelectedIndexChange)="onTabChange($event)">
      <!-- Tab đăng ký thường -->
      <nz-tab nzTitle="Cá nhân">
        <form [formGroup]="signupForm" class="signup-form" (ngSubmit)="submitNormalSignup()">
          <!-- Username -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Vui lòng nhập tên đăng nhập (ít nhất 3 ký tự)">
              <nz-input-group nzPrefixIcon="user">
                <input type="text" nz-input formControlName="username" placeholder="Tên đăng nhập" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Email -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Vui lòng nhập email hợp lệ">
              <nz-input-group nzPrefixIcon="mail">
                <input type="email" nz-input formControlName="email" placeholder="Email" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Password -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Mật khẩu phải có ít nhất 6 ký tự">
              <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixTemplate">
                <input [type]="passwordVisible ? 'text' : 'password'"
                  nz-input formControlName="password" placeholder="Mật khẩu" />
              </nz-input-group>
              <ng-template #suffixTemplate>
                <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                  (click)="passwordVisible = !passwordVisible"></i>
              </ng-template>
            </nz-form-control>
          </nz-form-item>

          <!-- Confirm Password -->
          <nz-form-item>
            <nz-form-control [nzErrorTip]="errorTpl">
              <nz-input-group nzPrefixIcon="lock" [nzSuffix]="confirmSuffixTemplate">
                <input [type]="confirmPasswordVisible ? 'text' : 'password'"
                  nz-input formControlName="confirmPassword" placeholder="Xác nhận mật khẩu" />
              </nz-input-group>
              <ng-template #confirmSuffixTemplate>
                <i nz-icon [nzType]="confirmPasswordVisible ? 'eye-invisible' : 'eye'"
                  (click)="confirmPasswordVisible = !confirmPasswordVisible"></i>
              </ng-template>
              <ng-template #errorTpl let-control>
                <ng-container *ngIf="control.hasError('required')">
                  Vui lòng xác nhận mật khẩu
                </ng-container>
                <ng-container *ngIf="signupForm.hasError('mismatch')">
                  Mật khẩu không khớp
                </ng-container>
              </ng-template>
            </nz-form-control>
          </nz-form-item>

          <!-- Full Name -->
          <nz-form-item>
            <nz-form-control>
              <nz-input-group nzPrefixIcon="user">
                <input type="text" nz-input formControlName="fullName" placeholder="Họ và tên" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Phone -->
          <nz-form-item>
            <nz-form-control>
              <nz-input-group nzPrefixIcon="phone">
                <input type="text" nz-input formControlName="phone" placeholder="Số điện thoại" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Submit Button -->
          <button nz-button nzType="primary" [nzLoading]="isLoading" class="submit-btn">
            Đăng ký
          </button>
        </form>
      </nz-tab>

      <!-- Tab đăng ký doanh nghiệp -->
      <nz-tab nzTitle="Doanh nghiệp">
        <form [formGroup]="businessForm" class="signup-form" (ngSubmit)="submitBusinessSignup()">
          <!-- Username -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Vui lòng nhập tên đăng nhập (ít nhất 3 ký tự)">
              <nz-input-group nzPrefixIcon="user">
                <input type="text" nz-input formControlName="username" placeholder="Tên đăng nhập" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Email -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Vui lòng nhập email hợp lệ">
              <nz-input-group nzPrefixIcon="mail">
                <input type="email" nz-input formControlName="email" placeholder="Email" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Password -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Mật khẩu phải có ít nhất 6 ký tự">
              <nz-input-group nzPrefixIcon="lock" [nzSuffix]="businessSuffixTemplate">
                <input [type]="businessPasswordVisible ? 'text' : 'password'"
                  nz-input formControlName="password" placeholder="Mật khẩu" />
              </nz-input-group>
              <ng-template #businessSuffixTemplate>
                <i nz-icon [nzType]="businessPasswordVisible ? 'eye-invisible' : 'eye'"
                  (click)="businessPasswordVisible = !businessPasswordVisible"></i>
              </ng-template>
            </nz-form-control>
          </nz-form-item>

          <!-- Confirm Password -->
          <nz-form-item>
            <nz-form-control [nzErrorTip]="businessErrorTpl">
              <nz-input-group nzPrefixIcon="lock" [nzSuffix]="businessConfirmSuffixTemplate">
                <input [type]="businessConfirmPasswordVisible ? 'text' : 'password'"
                  nz-input formControlName="confirmPassword" placeholder="Xác nhận mật khẩu" />
              </nz-input-group>
              <ng-template #businessConfirmSuffixTemplate>
                <i nz-icon [nzType]="businessConfirmPasswordVisible ? 'eye-invisible' : 'eye'"
                  (click)="businessConfirmPasswordVisible = !businessConfirmPasswordVisible"></i>
              </ng-template>
              <ng-template #businessErrorTpl let-control>
                <ng-container *ngIf="control.hasError('required')">
                  Vui lòng xác nhận mật khẩu
                </ng-container>
                <ng-container *ngIf="businessForm.hasError('mismatch')">
                  Mật khẩu không khớp
                </ng-container>
              </ng-template>
            </nz-form-control>
          </nz-form-item>

          <!-- Full Name -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Vui lòng nhập họ và tên">
              <nz-input-group nzPrefixIcon="user">
                <input type="text" nz-input formControlName="fullName" placeholder="Họ và tên" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Phone -->
          <nz-form-item>
            <nz-form-control nzErrorTip="Vui lòng nhập số điện thoại">
              <nz-input-group nzPrefixIcon="phone">
                <input type="text" nz-input formControlName="phone" placeholder="Số điện thoại" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <!-- Business Info -->
          <div formGroupName="businessInfo">
            <!-- Business Name -->
            <nz-form-item>
              <nz-form-control nzErrorTip="Vui lòng nhập tên doanh nghiệp">
                <nz-input-group nzPrefixIcon="shop">
                  <input type="text" nz-input formControlName="name" placeholder="Tên doanh nghiệp" />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <!-- Legal Name -->
            <nz-form-item>
              <nz-form-control nzErrorTip="Vui lòng nhập tên pháp lý">
                <nz-input-group nzPrefixIcon="solution">
                  <input type="text" nz-input formControlName="legalName" placeholder="Tên pháp lý" />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <!-- Tax ID -->
            <nz-form-item>
              <nz-form-control nzErrorTip="Vui lòng nhập mã số thuế">
                <nz-input-group nzPrefixIcon="audit">
                  <input type="text" nz-input formControlName="taxId" placeholder="Mã số thuế" />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <!-- Address -->
            <nz-form-item>
              <nz-form-control nzErrorTip="Vui lòng nhập địa chỉ">
                <nz-input-group nzPrefixIcon="environment">
                  <input type="text" nz-input formControlName="address" placeholder="Địa chỉ" />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <!-- Business Contact Info -->
            <div formGroupName="contactInfo">
              <!-- Business Email -->
              <nz-form-item>
                <nz-form-control>
                  <nz-input-group nzPrefixIcon="mail">
                    <input type="email" nz-input formControlName="email" placeholder="Email doanh nghiệp (tùy chọn)" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>

              <!-- Business Phone -->
              <nz-form-item>
                <nz-form-control>
                  <nz-input-group nzPrefixIcon="phone">
                    <input type="text" nz-input formControlName="phone" placeholder="Số điện thoại doanh nghiệp (tùy chọn)" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>

              <!-- Website -->
              <nz-form-item>
                <nz-form-control>
                  <nz-input-group nzPrefixIcon="global">
                    <input type="text" nz-input formControlName="website" placeholder="Website (tùy chọn)" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>

          <!-- Submit Button -->
          <button nz-button nzType="primary" [nzLoading]="isLoading" class="submit-btn">
            Đăng ký doanh nghiệp
          </button>
        </form>
      </nz-tab>
    </nz-tabset>

    <div class="login-link">
      Đã có tài khoản? <a routerLink="/login">Đăng nhập ngay</a>
    </div>
  </nz-card>
</div>
