<div class="hotel-files">
  <h2>Kho tài liệu khách sạn</h2>
  <div class="toolbar">
    <input nz-input [(ngModel)]="searchText" placeholder="Tìm kiếm file..." />
  </div>
  <div *ngIf="!isMobile" class="table-container">
    <nz-table [nzData]="filteredFiles" nzSize="small" [nzShowPagination]="false">
      <thead>
        <tr>
          <th>Tên file</th>
          <th>Loại</th>
          <th style="width: 180px; text-align: right;">Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of filteredFiles">
          <td>{{ f.name }}</td>
          <td>{{ f.type.toUpperCase() }}</td>
          <td style="text-align: right;">
            <button nz-button nzType="default" (click)="openInline(f)" class="mr-1">Xem</button>
            <button nz-button nzType="default" (click)="openInNewTab(f)" class="mr-1">Mở</button>
            <button nz-button nzType="primary" (click)="download(f)">Tải về</button>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div *ngIf="isMobile" class="cards">
    <div class="file-card" *ngFor="let f of filteredFiles">
      <div class="file-name">{{ f.name }}</div>
      <div class="file-meta">{{ f.type.toUpperCase() }}</div>
      <div class="file-actions">
        <button nz-button nzType="default" (click)="openInline(f)">Xem</button>
        <button nz-button nzType="default" (click)="openInNewTab(f)">Mở</button>
        <button nz-button nzType="primary" (click)="download(f)">Tải về</button>
      </div>
    </div>
  </div>

  <div *ngIf="selectedFile" class="overlay" (click)="closeOverlay()">
    <div class="overlay-content" (click)="$event.stopPropagation()">
      <div class="overlay-header">
        <div class="title">Xem: {{ selectedFile.name }}</div>
        <button nz-button nzType="default" (click)="closeOverlay()">Đóng</button>
      </div>
      <div class="overlay-body">
        <div *ngIf="pdfUrl" class="viewer-block">
          <iframe [src]="pdfUrl" class="viewer-iframe" frameborder="0"></iframe>
        </div>
        <div *ngIf="isDocx" class="viewer-block">
          <div #docxContainer class="docx-container"></div>
        </div>
        <div *ngIf="officeUrl && !pdfUrl" class="viewer-block">
          <iframe [src]="officeUrl" class="viewer-iframe" frameborder="0"></iframe>
        </div>
        <div *ngIf="xlsxRows.length > 0 && !pdfUrl && !officeUrl" class="viewer-block">
          <nz-table [nzData]="xlsxRows" nzSize="small" [nzShowPagination]="true">
            <thead>
              <tr>
                <th *ngFor="let col of xlsxColumns">{{ col }}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of xlsxRows">
                <td *ngFor="let col of xlsxColumns">{{ row[col] }}</td>
              </tr>
            </tbody>
          </nz-table>
        </div>
        <div *ngIf="selectedFile && !pdfUrl && !officeUrl && xlsxRows.length === 0" class="text-muted">
          Không thể hiển thị trực tiếp, vui lòng dùng nút Tải về.
        </div>
      </div>
    </div>
  </div>
</div>
