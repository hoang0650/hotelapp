<div class="hotel-files">
  <h2>Kho tài liệu khách sạn</h2>
  <div class="toolbar">
    <input nz-input [(ngModel)]="searchText" placeholder="Tìm kiếm file..." />
  </div>
  <nz-table [nzData]="filteredFiles" nzSize="small" [nzShowPagination]="false">
    <thead>
      <tr>
        <th>Tên file</th>
        <th>Loại</th>
        <th style="width: 180px; text-align: right;">Thao tác</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let f of filteredFiles">
        <td>{{ f.name }}</td>
        <td>{{ f.type.toUpperCase() }}</td>
        <td style="text-align: right;">
          <button nz-button nzType="default" (click)="openInline(f)" class="mr-1">Mở</button>
          <button nz-button nzType="primary" (click)="download(f)">Tải về</button>
        </td>
      </tr>
    </tbody>
  </nz-table>

  <div *ngIf="selectedFile" class="viewer mt-2">
    <h3>Xem: {{ selectedFile.name }}</h3>
    <div *ngIf="pdfUrl">
      <iframe [src]="pdfUrl" style="width: 100%; height: 70vh;" frameborder="0"></iframe>
    </div>
    <div *ngIf="isDocx">
      <div #docxContainer style="width: 100%; min-height: 70vh; background: #fff; padding: 12px; border: 1px solid #f0f0f0; border-radius: 6px;"></div>
    </div>
    <div *ngIf="officeUrl && !pdfUrl">
      <iframe [src]="officeUrl" style="width: 100%; height: 70vh;" frameborder="0"></iframe>
    </div>
    <div *ngIf="xlsxRows.length > 0 && !pdfUrl && !officeUrl">
      <nz-table [nzData]="xlsxRows" nzSize="small" [nzShowPagination]="true">
        <thead>
          <tr>
            <th *ngFor="let col of xlsxColumns">{{ col }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of xlsxRows">
            <td *ngFor="let col of xlsxColumns">{{ row[col] }}</td>
          </tr>
        </tbody>
      </nz-table>
    </div>
    <div *ngIf="selectedFile && !pdfUrl && !officeUrl && xlsxRows.length === 0" class="text-muted">
      Không thể hiển thị trực tiếp, vui lòng dùng nút Tải về.
    </div>
  </div>
</div>
