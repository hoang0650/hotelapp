<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-sm-6 col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Quên mật khẩu</h5>
          <p class="text-center text-muted mb-4">Nhập email hoặc tên đăng nhập của bạn để nhận link đặt lại mật khẩu</p>
          <form nz-form [formGroup]="forgotPasswordForm" class="login-form" (ngSubmit)="submitForm()">
            <nz-form-item>
              <nz-form-control nzErrorTip="Vui lòng nhập email hoặc tên đăng nhập!">
                <nz-input-group nzPrefixIcon="user">
                  <input type="text" nz-input formControlName="emailOrUsername" placeholder="Email hoặc Tên đăng nhập" />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>

            <button nz-button 
                    [nzType]="'primary'" 
                    [nzLoading]="isLoading"
                    [nzBlock]="true"
                    class="login-form-button login-form-margin">
              Gửi link đặt lại mật khẩu
            </button>
            
            <div nz-row class="login-form-margin text-center">
              <a (click)="goToLogin()" style="cursor: pointer;">Quay lại đăng nhập</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
