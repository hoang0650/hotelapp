<div class="e-invoice-template-container">
  <div class="page-header">
    <h1>Mẫu hóa đơn điện tử</h1>
    <p class="subtitle">Chọn và quản lý mẫu hóa đơn điện tử từ nhà cung cấp</p>
    <div *ngIf="providerService.getSelectedProvider()" class="provider-info">
      <nz-tag [nzColor]="providerService.getSelectedProvider()?.active ? 'success' : 'default'">
        <i nz-icon nzType="cloud-server" nzTheme="outline"></i>
        {{ providerService.getSelectedProvider()?.provider }}
      </nz-tag>
    </div>
  </div>

  <div class="content-wrapper">
    <nz-spin [nzSpinning]="loading">
      <nz-empty 
        *ngIf="!loading && templates.length === 0"
        nzNotFoundContent="Chưa có mẫu hóa đơn nào. Vui lòng chọn tài khoản nhà cung cấp trước."
        [nzNotFoundImage]="'simple'">
      </nz-empty>

      <div *ngIf="!loading && templates.length > 0" class="templates-grid">
        <div 
          *ngFor="let template of templates"
          class="template-card"
          [class.selected]="selectedTemplate?.template_code === template.template_code"
          [class.default]="template.isDefault"
          (click)="selectTemplate(template)">
          <div class="template-header">
            <h3>{{ getTemplateDisplayName(template) }}</h3>
            <nz-tag *ngIf="template.isDefault" nzColor="blue">Mặc định</nz-tag>
          </div>
          <div class="template-preview">
            <div *ngIf="template.previewImage" class="preview-image">
              <img [src]="template.previewImage" [alt]="getTemplateDisplayName(template)" />
            </div>
            <div *ngIf="!template.previewImage" class="preview-placeholder">
              <i nz-icon nzType="file-text" nzTheme="outline" style="font-size: 48px; color: #d9d9d9;"></i>
            </div>
          </div>
          <div class="template-description">
            <p>{{ getTemplateDescription(template) }}</p>
            <div class="template-meta">
              <span class="template-code">
                <i nz-icon nzType="barcode" nzTheme="outline"></i>
                Mã: {{ template.template_code }}
              </span>
              <span class="template-series">
                <i nz-icon nzType="number" nzTheme="outline"></i>
                Series: {{ template.invoice_series }}
              </span>
            </div>
          </div>
          <div class="template-actions">
            <button 
              nz-button 
              nzType="default"
              nzSize="small"
              (click)="previewTemplate(template); $event.stopPropagation()">
              <i nz-icon nzType="eye" nzTheme="outline"></i>
              Xem trước
            </button>
            <button 
              *ngIf="!template.isDefault"
              nz-button 
              nzType="primary"
              nzSize="small"
              (click)="setAsDefault(template); $event.stopPropagation()">
              <i nz-icon nzType="check-circle" nzTheme="outline"></i>
              Đặt mặc định
            </button>
          </div>
        </div>
      </div>
    </nz-spin>
  </div>
</div>
