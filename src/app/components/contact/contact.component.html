<div class="contact-container">
  <nz-card class="contact-card">
    <h2 class="text-center mb-4">{{ 'CONTACT.TITLE' | translate }}</h2>
    <p class="text-center mb-4" style="color: #666;">
      {{ 'CONTACT.DESCRIPTION' | translate }}
    </p>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
      <!-- Tên -->
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'CONTACT.FULL_NAME' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'CONTACT.ERROR_FULL_NAME' | translate">
          <nz-input-group nzPrefixIcon="user">
            <input type="text" nz-input formControlName="name" [placeholder]="'CONTACT.PLACEHOLDER_FULL_NAME' | translate" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Email -->
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'CONTACT.EMAIL' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'CONTACT.ERROR_EMAIL' | translate">
          <nz-input-group nzPrefixIcon="mail">
            <input type="email" nz-input formControlName="email" [placeholder]="'CONTACT.PLACEHOLDER_EMAIL' | translate" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Số điện thoại -->
      <nz-form-item>
        <nz-form-label>{{ 'CONTACT.PHONE' | translate }}</nz-form-label>
        <nz-form-control>
          <nz-input-group nzPrefixIcon="phone">
            <input type="text" nz-input formControlName="phone" [placeholder]="'CONTACT.PLACEHOLDER_PHONE' | translate" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Chủ đề -->
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'CONTACT.SUBJECT' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'CONTACT.ERROR_SUBJECT' | translate">
          <nz-input-group nzPrefixIcon="file-text">
            <input type="text" nz-input formControlName="subject" [placeholder]="'CONTACT.PLACEHOLDER_SUBJECT' | translate" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Nội dung -->
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'CONTACT.MESSAGE' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'CONTACT.ERROR_MESSAGE' | translate">
          <textarea 
            nz-input 
            formControlName="message" 
            rows="6" 
            [placeholder]="'CONTACT.PLACEHOLDER_MESSAGE' | translate"></textarea>
        </nz-form-control>
      </nz-form-item>

      <!-- Submit Button -->
      <nz-form-item>
        <nz-form-control>
          <button 
            nz-button 
            nzType="primary" 
            nzSize="large" 
            [nzLoading]="isLoading" 
            [disabled]="contactForm.invalid"
            class="submit-btn">
            <i nz-icon nzType="send" nzTheme="outline"></i>
            {{ 'CONTACT.SUBMIT' | translate }}
          </button>
        </nz-form-control>
      </nz-form-item>
    </form>
  </nz-card>
</div>
