<div class="contact-container">
  <nz-card class="contact-card">
    <h2 class="text-center mb-4">Liên hệ với chúng tôi</h2>
    <p class="text-center mb-4" style="color: #666;">
      Chúng tôi luôn sẵn sàng lắng nghe và hỗ trợ bạn. Hãy gửi tin nhắn cho chúng tôi!
    </p>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
      <!-- Tên -->
      <nz-form-item>
        <nz-form-label nzRequired>Họ và tên</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập họ và tên (ít nhất 2 ký tự)">
          <nz-input-group nzPrefixIcon="user">
            <input type="text" nz-input formControlName="name" placeholder="Nhập họ và tên của bạn" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Email -->
      <nz-form-item>
        <nz-form-label nzRequired>Email</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập email hợp lệ">
          <nz-input-group nzPrefixIcon="mail">
            <input type="email" nz-input formControlName="email" placeholder="Nhập địa chỉ email của bạn" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Số điện thoại -->
      <nz-form-item>
        <nz-form-label>Số điện thoại</nz-form-label>
        <nz-form-control>
          <nz-input-group nzPrefixIcon="phone">
            <input type="text" nz-input formControlName="phone" placeholder="Nhập số điện thoại (tùy chọn)" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Chủ đề -->
      <nz-form-item>
        <nz-form-label nzRequired>Chủ đề</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập chủ đề (ít nhất 5 ký tự)">
          <nz-input-group nzPrefixIcon="file-text">
            <input type="text" nz-input formControlName="subject" placeholder="Nhập chủ đề liên hệ" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Nội dung -->
      <nz-form-item>
        <nz-form-label nzRequired>Nội dung</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập nội dung (ít nhất 10 ký tự)">
          <textarea 
            nz-input 
            formControlName="message" 
            rows="6" 
            placeholder="Nhập nội dung tin nhắn của bạn..."></textarea>
        </nz-form-control>
      </nz-form-item>

      <!-- Submit Button -->
      <nz-form-item>
        <nz-form-control>
          <button 
            nz-button 
            nzType="primary" 
            nzSize="large" 
            [nzLoading]="isLoading" 
            [disabled]="contactForm.invalid"
            class="submit-btn">
            <i nz-icon nzType="send" nzTheme="outline"></i>
            Gửi liên hệ
          </button>
        </nz-form-control>
      </nz-form-item>
    </form>
  </nz-card>
</div>
